  <rect x="82" y="96" width="28" height="5" rx="2" fill="#1f2a44" opacity=".5" transform="rotate(-4 101 93)"/>
  <rect x="146" y="70" width="62" height="54" rx="4" fill="#9ee6c9" transform="rotate(3 177 97)"/>
  <rect x="158" y="88" width="38" height="5" rx="2" fill="#1f2a44" opacity=".5" transform="rotate(3 177 97)"/>
