  </g>
  <path d="M488 162 l8 8 l16 -16" fill="none" stroke="#2bb673" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- process flow -->
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
